name: Trace
options:
  bundleIdPrefix: com.chaselewis
  deploymentTarget:
    iOS: "16.0"

targets:
  Trace:
    type: application
    platform: iOS
    sources:
      - path: Trace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaselewis.Trace
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
    info:
      path: Trace/Info.plist
      properties:
        NSCameraUsageDescription: "Trace uses your camera to display a live feed so you can trace a reference photo onto paper."
        NSPhotoLibraryUsageDescription: "Trace needs access to your photo library so you can pick a reference image to trace."
        UILaunchStoryboardName: ""
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
